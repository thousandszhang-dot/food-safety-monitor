name: Refresh FoodWatch and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mfds_collector.rb'
      - 'refresh_mfds_snapshot.py'
      - '.github/workflows/update-and-deploy.yml'
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai
    - cron: '0 13 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: foodwatch-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and current RASFF snapshot
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Ruby for public MFDS list collector
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install MFDS HTML parser
        run: gem install nokogiri --no-document

      - name: Refresh MFDS public list and embed snapshot
        run: |
          if [ -f index.html.gz ]; then
            gunzip -kf index.html.gz
          fi
          if ruby mfds_collector.rb; then
            echo "MFDS public list refreshed successfully."
          else
            echo "::warning::MFDS public list is unreachable from this runner; deploying the last saved MFDS snapshot."
          fi
          python3 refresh_mfds_snapshot.py

      - name: Refresh official RASFF data and page snapshot
        env:
          SANTE_SUBSCRIPTION_KEY: ${{ secrets.SANTE_SUBSCRIPTION_KEY }}
        run: |
          if [ -f data/rasff_notifications.json.gz ]; then
            gunzip -kf data/rasff_notifications.json.gz
          fi
          if [ -n "$SANTE_SUBSCRIPTION_KEY" ]; then
            python3 rasff_collector.py
            python3 embed_rasff_snapshot.py
          else
            echo "::warning::SANTE_SUBSCRIPTION_KEY is not configured; RASFF remains at its saved snapshot date. MFDS was refreshed from its public list page."
          fi
          mkdir -p public
          cp index.html public/index.html
          gzip -fn data/rasff_notifications.json
          gzip -fn index.html

      - name: Save refreshed source snapshot
        run: |
          if ! git diff --quiet -- data/rasff_notifications.json.gz data/mfds_import_noncompliant.json index.html.gz; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/rasff_notifications.json.gz data/mfds_import_noncompliant.json index.html.gz
            git commit -m "Refresh FoodWatch RASFF snapshot"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
