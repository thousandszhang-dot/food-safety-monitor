name: Refresh FoodWatch and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: Asia/Shanghai
    - cron: '0 13 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: foodwatch-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site and current RASFF snapshot
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh official RASFF data and page snapshot
        env:
          SANTE_SUBSCRIPTION_KEY: ${{ secrets.SANTE_SUBSCRIPTION_KEY }}
        run: |
          if [ -f index.html.gz ]; then
            gunzip -kf index.html.gz
          fi
          if [ -f data/rasff_notifications.json.gz ]; then
            gunzip -kf data/rasff_notifications.json.gz
          fi
          if [ -n "$SANTE_SUBSCRIPTION_KEY" ]; then
            python3 rasff_collector.py
            python3 embed_rasff_snapshot.py
          else
            echo "::warning::SANTE_SUBSCRIPTION_KEY is not configured; deploying the saved snapshot without refreshing RASFF data."
          fi
          mkdir -p public
          cp index.html public/index.html
          gzip -fn data/rasff_notifications.json
          gzip -fn index.html

      - name: Save refreshed source snapshot
        run: |
          if ! git diff --quiet -- data/rasff_notifications.json.gz index.html.gz public/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data/ index.html index.html.gz public/index.html
            git commit -m "Refresh FoodWatch RASFF snapshot"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
